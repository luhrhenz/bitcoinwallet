[package]
name = "btcw-core"
description = "Wallet engine for btcw: keys, encrypted keystore, chain sync, PSBT signing and persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Compiles mainnet support in. It still needs an explicit runtime opt-in (see config.rs).
mainnet = []
# Exposes `testnode`, a throwaway regtest bitcoind for integration tests.
test-utils = ["dep:tempfile"]

[dependencies]
bdk_wallet.workspace = true
bdk_bitcoind_rpc.workspace = true
bip39.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
secrecy.workspace = true
zeroize.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dotenvy.workspace = true
dirs.workspace = true
base64.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
btcw-core = { path = ".", features = ["test-utils"] }

[lints]
workspace = true
